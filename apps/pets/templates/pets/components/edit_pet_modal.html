{% if selected_pet %}
<!-- Edit Pet Profile Modal -->
<div id="edit-pet-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeEditPetModal()"></div>
    <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
        <div class="px-6 pt-6 pb-4 border-b border-black/5">
            <button type="button" onclick="closeEditPetModal()"
                class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center text-text-muted transition-colors border-0 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 class="text-lg font-bold text-text-dark">แก้ไขโปรไฟล์สัตว์เลี้ยง</h2>
            <p class="text-sm text-text-muted mt-0.5">อัปเดตข้อมูลของ น้อง{{ selected_pet.name|default:"" }}</p>
        </div>
        <form method="POST" action="{% url 'pets:edit_pet' selected_pet.id %}"
            class="px-6 py-5 flex flex-col gap-4">
            {% csrf_token %}
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">ชื่อสัตว์เลี้ยง</label>
                <input type="text" name="name" value="{{ selected_pet.name }}" placeholder="ชื่อสัตว์เลี้ยง"
                    required
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">ประเภทสัตว์เลี้ยง</label>
                <select name="pet_type" id="edit_pet_type" required
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    <option value="DOG">สุนัข</option>
                    <option value="CAT">แมว</option>
                    <option value="RABBIT">กระต่าย</option>
                    <option value="OTHER">อื่นๆ</option>
                </select>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">เพศ</label>
                <select name="gender" id="edit_gender" required
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
                    <option value="M">♂ ผู้</option>
                    <option value="F">♀ เมีย</option>
                </select>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">สายพันธุ์</label>
                <input type="text" name="breed" value="{{ selected_pet.breed|default:'' }}"
                    placeholder="เช่น บลูเทอร์เรีย, ไซบีเรียน"
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">วันเกิด</label>
                <input type="date" name="birth_date" value="{{ selected_pet.birth_date|date:'Y-m-d' }}" required
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
            </div>
            <div class="flex justify-end gap-3 pt-1">
                <button type="button" onclick="closeEditPetModal()"
                    class="px-5 py-2.5 rounded-xl border border-black/10 text-sm font-medium text-text-dark hover:bg-black/5 transition-colors cursor-pointer bg-white">
                    ยกเลิก
                </button>
                <button type="submit"
                    class="px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary-hover transition-colors cursor-pointer border-0">
                    บันทึก
                </button>
            </div>
        </form>
    </div>
</div>
{% endif %}

<script>
    function openEditPetModal() {
        document.getElementById('edit-pet-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }
    function closeEditPetModal() {
        document.getElementById('edit-pet-modal').classList.add('hidden');
        document.body.style.overflow = '';
    }

    document.addEventListener('DOMContentLoaded', function () {
        const editPetTypeSelect = document.getElementById('edit_pet_type');
        const editGenderSelect = document.getElementById('edit_gender');
        if (editPetTypeSelect) {
            editPetTypeSelect.value = "{{ selected_pet.pet_type|default:'DOG' }}";
        }
        if (editGenderSelect) {
            editGenderSelect.value = "{{ selected_pet.gender|default:'M' }}";
        }
    });
</script>
