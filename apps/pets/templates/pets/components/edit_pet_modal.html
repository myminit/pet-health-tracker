<!-- edit_pet_modal.html -->
<!-- Usage: include 'pets/components/edit_pet_modal.html' -->
<!-- Trigger: openEditPetModal() — pre-fills from selected_pet context variable -->

<div id="edit-pet-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm p-4">
    <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-modal-in hide-scrollbar">

        <!-- Decorative top strip -->
        <div class="h-1.5 w-full bg-gradient-to-r from-primary via-primary/70 to-primary/30"></div>

        <!-- Header -->
        <div class="px-6 pt-5 pb-4 border-b border-black/5 relative">
            <button type="button" onclick="closeEditPetModal()"
                class="absolute top-5 right-5 w-8 h-8 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center text-text-muted transition-colors border-0 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center text-lg">✎</div>
                <div>
                    <h2 class="text-lg font-bold text-text-dark">แก้ไขโปรไฟล์</h2>
                    <p class="text-xs text-text-muted mt-0.5">อัปเดตข้อมูลน้อง{{ selected_pet.name|default:"" }}</p>
                </div>
            </div>
        </div>

        <form method="POST" action="{% url 'pets:edit_pet' selected_pet.id %}"
            class="px-8 pb-8">
            {% csrf_token %}

            <!-- ประเภท -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-text-dark mb-3">ประเภท</label>
                <div class="grid grid-cols-5 gap-2" id="edit-pet-type-group">
                    {% for value, emoji, label in pet_type_choices %}
                    <label
                        class="pet-type-card relative flex flex-col items-center gap-2 p-3 rounded-2xl border-2 cursor-pointer transition-all {% if selected_pet.pet_type|upper == value|upper %}border-primary bg-primary/10 ring-2 ring-primary/20 shadow-sm{% else %}border-black/8 bg-white hover:border-primary/40{% endif %}">
                        <!-- prettier-ignore -->
                        <input type="radio" name="pet_type" value="{{ value }}" class="sr-only" {% if selected_pet.pet_type|upper == value|upper %}checked{% endif %}>
                        <span class="absolute top-2 right-2 flex h-5 w-5 items-center justify-center rounded-full bg-primary text-white text-[10px] {% if selected_pet.pet_type|upper == value|upper %}block{% else %}hidden{% endif %}">✓</span>
                        <span class="text-3xl">{{ emoji }}</span>
                        <span class="text-xs font-medium text-text-dark">{{ label }}</span>
                    </label>
                    {% empty %}
                    <label
                        class="pet-type-card flex flex-col items-center gap-2 p-3 rounded-2xl border-2 border-black/8 bg-white hover:border-primary/40 cursor-pointer transition-all">
                        <input type="radio" name="pet_type" value="dog" class="sr-only">
                        <span class="text-3xl">🐶</span>
                        <span class="text-xs font-medium text-text-dark">สุนัข</span>
                    </label>
                    <label
                        class="pet-type-card flex flex-col items-center gap-2 p-3 rounded-2xl border-2 border-black/8 bg-white hover:border-primary/40 cursor-pointer transition-all">
                        <input type="radio" name="pet_type" value="cat" class="sr-only">
                        <span class="text-3xl">🐱</span>
                        <span class="text-xs font-medium text-text-dark">แมว</span>
                    </label>
                    <label
                        class="pet-type-card flex flex-col items-center gap-2 p-3 rounded-2xl border-2 border-black/8 bg-white hover:border-primary/40 cursor-pointer transition-all">
                        <input type="radio" name="pet_type" value="rabbit" class="sr-only">
                        <span class="text-3xl">🐰</span>
                        <span class="text-xs font-medium text-text-dark">กระต่าย</span>
                    </label>
                    <label
                        class="pet-type-card flex flex-col items-center gap-2 p-3 rounded-2xl border-2 border-black/8 bg-white hover:border-primary/40 cursor-pointer transition-all">
                        <input type="radio" name="pet_type" value="bird" class="sr-only">
                        <span class="text-3xl">🐦</span>
                        <span class="text-xs font-medium text-text-dark">นก</span>
                    </label>
                    <label
                        class="pet-type-card flex flex-col items-center gap-2 p-3 rounded-2xl border-2 border-black/8 bg-white hover:border-primary/40 cursor-pointer transition-all">
                        <input type="radio" name="pet_type" value="other" class="sr-only">
                        <span class="text-3xl">🐾</span>
                        <span class="text-xs font-medium text-text-dark">อื่นๆ</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- ชื่อเล่น + สายพันธุ์ -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-2">
                        ชื่อเล่น<span class="text-primary">*</span>
                    </label>
                    <input type="text" name="name" required placeholder="เช่น ขนมปัง"
                        value="{{ selected_pet.name|default:'' }}"
                        class="w-full bg-primary/5 border-0 rounded-2xl px-4 py-3 text-sm text-text-dark placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-2">สายพันธุ์</label>
                    <input type="text" name="breed" placeholder="เช่น Golden Retriever"
                        value="{{ selected_pet.breed|default:'' }}"
                        class="w-full bg-primary/5 border-0 rounded-2xl px-4 py-3 text-sm text-text-dark placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all">
                </div>
            </div>

            <!-- วันเกิด + น้ำหนัก -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-2">วันเกิด</label>
                    <input type="date" name="birth_date" value="{{ selected_pet.birth_date|date:'Y-m-d'|default:'' }}"
                        class="w-full bg-primary/5 border-0 rounded-2xl px-4 py-3 text-sm text-text-dark focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-2">น้ำหนัก (กก.)</label>
                    <input type="number" name="weight" step="0.01" min="0" placeholder="0.00"
                        value="{{ latest_weight|default:'' }}"
                        class="w-full bg-primary/5 border-0 rounded-2xl px-4 py-3 text-sm text-text-dark placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all">
                </div>
            </div>

            <!-- เป้าหมายแคลอรี + เพศ -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-2">เป้าหมายแคลอรี/วัน (kcal)</label>
                    <div class="relative">
                        <input type="number" name="calorie_goal" min="0" placeholder="500"
                            value="{{ selected_pet.calorie_goal|default:'' }}"
                            class="w-full bg-primary/5 border-0 rounded-2xl px-4 py-3 pr-16 text-sm text-text-dark placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-semibold text-text-muted">kcal</span>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-2">เพศ</label>
                    <div class="flex gap-3">
                        <label
                            class="flex items-center gap-2 bg-primary/5 rounded-2xl px-5 py-3 cursor-pointer border-2 border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-all">
                            <!-- prettier-ignore -->
                            <input type="radio" name="gender" value="M" class="sr-only" {% if selected_pet.gender == 'M' %}checked{% endif %}>
                            <span class="text-sm font-medium text-text-dark">♂ ผู้</span>
                        </label>
                        <label
                            class="flex items-center gap-2 bg-primary/5 rounded-2xl px-5 py-3 cursor-pointer border-2 border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-all">
                            <!-- prettier-ignore -->
                            <input type="radio" name="gender" value="F" class="sr-only" {% if selected_pet.gender == 'F' %}checked{% endif %}>
                            <span class="text-sm font-medium text-text-dark">♀ เมีย</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- โน้ตเพิ่มเติม -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-text-dark mb-2">โน้ตเพิ่มเติม</label>
                <textarea name="notes" rows="3" placeholder="นิสัย, โรคประจำตัว, อาหารโปรด..."
                    class="w-full bg-primary/5 border-0 rounded-2xl px-4 py-3 text-sm text-text-dark placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all resize-none">{{ selected_pet.notes|default:'' }}</textarea>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-3 pt-1">
                <button type="button" onclick="closeEditPetModal()"
                    class="px-5 py-2.5 rounded-xl border border-black/10 text-sm font-medium text-text-dark hover:bg-black/5 transition-colors cursor-pointer bg-white">
                    ยกเลิก
                </button>
                <button type="submit"
                    class="px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary-hover transition-colors cursor-pointer border-0 flex items-center gap-2">
                    บันทึกการเปลี่ยนแปลง
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function openEditPetModal() {
        const modal = document.getElementById('edit-pet-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.style.overflow = 'hidden';
    }
    function closeEditPetModal() {
        const modal = document.getElementById('edit-pet-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.body.style.overflow = '';
    }

    document.addEventListener('DOMContentLoaded', function () {
        const editModal = document.getElementById('edit-pet-modal');
        if (!editModal) return;

        editModal.querySelectorAll('#edit-pet-type-group .pet-type-card input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function () {
                editModal.querySelectorAll('#edit-pet-type-group .pet-type-card').forEach(card => {
                    card.classList.remove('border-primary', 'bg-primary/5');
                    card.classList.add('border-black/8', 'bg-white');
                });
                if (this.checked) {
                    this.closest('.pet-type-card').classList.add('border-primary', 'bg-primary/5');
                    this.closest('.pet-type-card').classList.remove('border-black/8', 'bg-white');
                }
            });
        });

        editModal.addEventListener('click', function (e) {
            if (e.target === editModal) closeEditPetModal();
        });
    });
</script>

<style>
    .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }
</style>
