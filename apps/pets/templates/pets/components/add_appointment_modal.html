<!-- ==========================================
     add_appointment_modal.html
     Modal สำหรับเพิ่มนัดหมาย
     ========================================== -->

<div id="add-appointment-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center" role="dialog"
    aria-modal="true" aria-labelledby="appointment-modal-title">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeAddAppointmentModal()"></div>

    <!-- Modal Box -->
    <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden" id="appointment-modal-card">
        <!-- Decorative top strip -->
        <div class="h-1.5 w-full bg-gradient-to-r from-primary via-primary/70 to-primary/30"></div>

        <!-- Header -->
        <div class="px-6 pt-5 pb-4 border-b border-black/5">
            <button type="button" onclick="closeAddAppointmentModal()"
                class="absolute top-5 right-5 w-8 h-8 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center text-text-muted transition-colors border-0 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center text-lg">📅</div>
                <div>
                    <h2 id="appointment-modal-title" class="text-lg font-bold text-text-dark">เพิ่มนัดหมายใหม่</h2>
                    <p class="text-xs text-text-muted mt-0.5">น้อง{{ selected_pet.name|default:"" }} &middot;
                        <span id="appointment-modal-date-label">—</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Form Body -->
        <form method="POST" action="{% url 'pets:add_appointment' selected_pet.id %}" class="px-6 py-5 flex flex-col gap-4">
            {% csrf_token %}

            <!-- hidden: วันที่จากปฏิทิน -->
            <input type="hidden" name="due_date" id="appointment-due-date" required />

            <!-- ชื่อนัดหมาย -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">ชื่อนัดหมาย <span class="text-primary">*</span></label>
                <input type="text" name="title" required placeholder="เช่น ฉีดวัคซีน, ตรวจสุขภาพประจำปี"
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm placeholder-text-muted/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" />
            </div>

            <!-- เวลา (optional) -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">เวลา <span
                        class="text-text-muted/60 font-normal">(ถ้ามี)</span></label>
                <input type="time" name="time"
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" />
            </div>

            <!-- หมายเหตุ -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">หมายเหตุ <span
                        class="text-text-muted/60 font-normal">(ถ้ามี)</span></label>
                <textarea name="note" rows="3" placeholder="รายละเอียดเพิ่มเติม..."
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm placeholder-text-muted/60 resize-none leading-relaxed focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-3 pt-1">
                <button type="button" onclick="closeAddAppointmentModal()"
                    class="px-5 py-2.5 rounded-xl border border-black/10 text-sm font-medium text-text-dark hover:bg-black/5 transition-colors cursor-pointer bg-white">
                    ยกเลิก
                </button>
                <button type="submit"
                    class="px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary-hover transition-colors cursor-pointer border-0 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    บันทึกนัดหมาย
                </button>
            </div>
        </form>
    </div>
</div>

<!-- JavaScript สำหรับ Modal นัดหมาย -->
<script>
    // เรียกจาก overview.html: openAddAppointmentModal(isoDate, formattedLabel)
    // เช่น openAddAppointmentModal("2025-06-01", "1 มิถุนายน 2568")
    function openAddAppointmentModal(isoDate, formattedLabel) {
        const modal = document.getElementById('add-appointment-modal');

        // ใส่วันที่ใน hidden input เพื่อส่ง form
        const dateInput = document.getElementById('appointment-due-date');
        if (dateInput) dateInput.value = isoDate || '';

        // แสดงวันที่ที่เลือกใน header ของ modal
        const dateLabel = document.getElementById('appointment-modal-date-label');
        if (dateLabel) dateLabel.textContent = formattedLabel || isoDate || '';

        modal.classList.remove('hidden');

        document.body.style.overflow = 'hidden';
    }

    function closeAddAppointmentModal() {
        const modal = document.getElementById('add-appointment-modal');
        modal.classList.add('hidden');
        document.body.style.overflow = '';
    }

    // ปิด modal เมื่อกด backdrop
    document.getElementById('add-appointment-modal').addEventListener('click', function (e) {
        if (e.target === this) closeAddAppointmentModal();
    });

    // ปิด modal เมื่อกด Escape
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('add-appointment-modal');
            if (!modal.classList.contains('hidden')) closeAddAppointmentModal();
        }
    });
</script>
