<!-- Edit Diary Modal -->
<div id="edit-diary-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeEditDiaryModal()"></div>

    <!-- Modal Box -->
    <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden">

        <!-- Decorative top strip -->
        <div class="h-1.5 w-full bg-gradient-to-r from-primary via-primary/70 to-primary/30"></div>

        <!-- Header -->
        <div class="px-6 pt-5 pb-4 border-b border-black/5">
            <button type="button" onclick="closeEditDiaryModal()"
                class="absolute top-5 right-5 w-8 h-8 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center text-text-muted transition-colors border-0 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center text-lg">📝</div>
                <div>
                    <h2 class="text-lg font-bold text-text-dark">แก้ไขบันทึกไดอารี่</h2>
                    <p class="text-xs text-text-muted mt-0.5">น้อง{{ selected_pet.name|default:"" }}</p>
                </div>
            </div>
        </div>

        {% if selected_pet %}
        <!-- Form -->
        <form method="POST" id="edit-diary-form" action=""
            class="px-6 py-5 flex flex-col gap-4">
            {% csrf_token %}

            <!-- วันที่ -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">วันที่บันทึก</label>
                <input type="date" name="date" id="edit-diary-date" required
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
            </div>

            <!-- น้ำหนัก -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">น้ำหนัก (กก.)</label>
                <input type="number" name="weight" id="edit-diary-weight" required step="0.01" min="0"
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all">
            </div>

            <!-- บันทึก/โน้ต -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-text-dark">บันทึกเพิ่มเติม</label>
                <textarea name="note" id="edit-diary-note" rows="3" placeholder="เขียนสิ่งที่อยากจำเกี่ยวกับน้องวันนี้..."
                    class="w-full px-4 py-2.5 rounded-xl border border-black/10 bg-bg-color text-text-dark text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all resize-none leading-relaxed"></textarea>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end gap-3 pt-1">
                <button type="button" onclick="closeEditDiaryModal()"
                    class="px-5 py-2.5 rounded-xl border border-black/10 text-sm font-medium text-text-dark hover:bg-black/5 transition-colors cursor-pointer bg-white">
                    ยกเลิก
                </button>
                <button type="submit"
                    class="px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary-hover transition-colors cursor-pointer border-0 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    บันทึก
                </button>
            </div>
        </form>
        {% endif %}
    </div>
</div>

<script>
    function openEditDiaryModal(logId, logDate, logNote, logWeight) {
        // Set action url dynamically
        const form = document.getElementById('edit-diary-form');
        form.action = `/pet/{{ selected_pet.id }}/daily_log/${logId}/edit/`;
        
        // Populate fields
        document.getElementById('edit-diary-date').value = logDate;
        document.getElementById('edit-diary-note').value = logNote;
        // Populate weight
        const weightInput = document.getElementById('edit-diary-weight');
        if (weightInput) {
            weightInput.value = (typeof logWeight !== 'undefined' && logWeight !== null) ? logWeight : '';
        }

        document.getElementById('edit-diary-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }
    
    function closeEditDiaryModal() {
        document.getElementById('edit-diary-modal').classList.add('hidden');
        document.body.style.overflow = '';
    }
</script>
