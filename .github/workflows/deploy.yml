name: Django CI/CD to Render

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: pet_health_db_9k05
          POSTGRES_USER: admin01
          POSTGRES_PASSWORD: BqPuom2y6FWdK2TbUJ8HioA6nEXh85G8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # สเต็ปตัดปัญหาเรื่องไลบรารีระบบและคอมไพล์ psycopg2 พัง
    - name: Install PostgreSQL Client Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client gcc python3-dev

    - name: Install Dependencies
      env:
        DB_NAME: 'pet_health_db_9k05'
        DB_USER: 'admin01'
        DB_PASSWORD: 'BqPuom2y6FWdK2TbUJ8HioA6nEXh85G8'
        DB_HOST: '127.0.0.1' # ใช้ IP ตรงตัวเพื่อลดปัญหาการแปลง Hostname ในบอท
        DB_PORT: '5432'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django System Check
      env:
        DB_NAME: 'pet_health_db_9k05'
        DB_USER: 'admin01'
        DB_PASSWORD: 'BqPuom2y6FWdK2TbUJ8HioA6nEXh85G8'
        DB_HOST: '127.0.0.1'
        DB_PORT: '5432'
        SECRET_KEY: 'mock-key-for-compiler-pass' # ส่งคีย์หลอกกันเหนียว
      run: |
        # รันคำสั่งตรวจสอบแบบละเว้นการตรวจความพร้อมภายนอกบางส่วน
        python manage.py check

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Deploy to Render
      run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"