name: Django CI/CD to Render

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      # 💡 ตรงนี้แหละ! เราใส่ค่า PostgreSQL จำลองไว้ให้ GitHub Actions อ่านตอนติดตั้งระบบ
      env:
        DB_NAME: 'mock_db'
        DB_USER: 'mock_user'
        DB_PASSWORD: 'mock_password'
        DB_HOST: 'localhost'
        DB_PORT: '5432'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Render
      run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"