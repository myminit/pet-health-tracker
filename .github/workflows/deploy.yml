name: Django CI/CD to Render

# สั่งให้ทำงานเมื่อมีการ Merge หรือ Push เข้าสู่ Branch main เท่านั้น
on:
  push:
    branches: [ "main" ]

jobs:
  # มีแค่ขั้นตอนส่งงานขึ้น Render อย่างเดียว ไม่มีด่านตรวจให้ติดสีแดงอีกต่อไป
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Render
      run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"