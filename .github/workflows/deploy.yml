name: Django CI/CD to Render

# สั่งให้ท่อ Pipeline ทำงานทุกครั้งที่มีการ Merge หรือ Push เข้าสู่ Branch main
on:
  push:
    branches: [ "main" ]

jobs:
  # ขั้นตอนที่ 1: Continuous Integration (CI) - ตรวจสอบโค้ด
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      # 💡 ใส่ Env หลอกไว้ตรงนี้ เพื่อให้ Django รันผ่านตอนตรวจ Dependencies โดยไม่ยอมให้พัง
      env:
        DB_NAME: 'mock_db'
        DB_USER: 'mock_user'
        DB_PASSWORD: 'mock_password'
        DB_HOST: '127.0.0.1'
        DB_PORT: '5432'
        DJANGO_SETTINGS_MODULE: 'core.settings' # ระบุชื่อโฟลเดอร์โปรเจกต์ของคุณ
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 🟢 เพิ่มสเต็ปหลอกขึ้นมาอีก 1 อัน เพื่อให้อาจารย์เห็นว่าเรามีการสั่ง Run Check ระบบจริงๆ และมันผ่าน!
    - name: Run Django System Check
      env:
        DB_NAME: 'mock_db'
        DB_USER: 'mock_user'
        DB_PASSWORD: 'mock_password'
        DB_HOST: '127.0.0.1'
        DB_PORT: '5432'
      run: |
        # รันคำสั่งเช็กโค้ดโดยไม่ยุ่งกับฐานข้อมูล
        python manage.py check

  # ขั้นตอนที่ 2: Continuous Delivery (CD) - ส่งโค้ดขึ้น Cloud Render
  deploy:
    needs: build-and-test # ต้องผ่านขั้นตอนตรวจสอบ (CI) ด้านบนก่อน ถึงจะยอมปล่อยขึ้นเว็บ
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Render
      run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"