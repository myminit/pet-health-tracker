name: Django CI/CD to Render

# สั่งให้ทำงานทุกครั้งที่มีการกด Push หรือเปิด Pull Request เข้าสู่ Branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] # 🟢 เพิ่มบรรทัดนี้ เพื่อให้มันสแกนตรวจตั้งแต่ตอนอยู่ในหน้า PR เลย (จะได้รู้ว่าผ่านไหมก่อนเมิช)

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # จำลอง PostgreSQL ขึ้นมาบน GitHub เพื่อใช้รันเทสระบบดัก Error
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: pet_health_db_9k05
          POSTGRES_USER: admin01
          POSTGRES_PASSWORD: BqPuom2y6FWdK2TbUJ8HioA6nEXh85G8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 🔥 จุดตายที่ต้องแก้: ติดตั้งไลบรารีของ Postgres ลงเครื่อง Ubuntu ให้เสร็จก่อน เพื่อให้ลง psycopg2 ผ่าน
    - name: Install PostgreSQL Client Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client

    - name: Install Dependencies
      env:
        DB_NAME: 'pet_health_db_9k05'
        DB_USER: 'admin01'
        DB_PASSWORD: 'BqPuom2y6FWdK2TbUJ8HioA6nEXh85G8'
        DB_HOST: 'localhost'
        DB_PORT: '5432'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django System Check
      env:
        DB_NAME: 'pet_health_db_9k05'
        DB_USER: 'admin01'
        DB_PASSWORD: 'BqPuom2y6FWdK2TbUJ8HioA6nEXh85G8'
        DB_HOST: 'localhost'
        DB_PORT: '5432'
      run: |
        python manage.py check

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # สั่งให้ทำงานเฉพาะตอนที่โค้ดถูก Merge/Push เข้าสาขา main จริงๆ เท่านั้น (ตอนเปิด PR จะยังไม่ยิงไปดีพลอยบน Render)
    if: github.event_name == 'push'
    steps:
    - name: Deploy to Render
      run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"